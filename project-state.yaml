  phase_9_ipc_doc: "docs/BLENDER_BRIDGE_IPC.md"
  phase_9_risk_doc: "docs/BLENDER_BRIDGE_RISK_LOG.md"
  phase_9_feature_flags:
    env: "VITE_ENABLE_3D_TAB"
    local_override: "aiCanvas.flags.blender3dTab"
    default: "disabled"
  phase_9_process_manager:
    electron_module: "electron/blender-process-manager.cjs"
    config_file: "userData/blender-config.json"
    watchdog_enabled: true
    shutdown_cleanup: "before-quit stop"
  phase_9_embed_manager:
    electron_module: "electron/blender-embed-manager.cjs"
    helper_script: "scripts/win-window-parent.ps1"
    modes: ["attach", "position", "focus", "detach"]
    resize_sync: "renderer host bounds -> blender-embed-sync-bounds"
  phase_9_bridge_server:
    electron_module: "electron/blender-bridge-server.cjs"
    host: "127.0.0.1"
    port: 8765
    endpoints:
      - "/health"
      - "/v1/render/import"
      - "/v1/render/import-pass-set"
      - "/v1/camera/snapshot"
      - "/v1/camera/pending"
      - "/v1/camera/states/import"
      - "/v1/sequence/import"
      - "/v1/sequence/list"
    renderer_events: ["blender-bridge-import", "blender-bridge-camera-states", "blender-bridge-sequence"]
    pass_set_support: true
    metadata_sidecar_support: true
    camera_roundtrip_support: true
    sequence_handoff_support: true
  phase_9_blender_addon:
    script: "blender_addon/ai_canvas_bridge_addon.py"
    setup_doc: "docs/BLENDER_ADDON_SETUP.md"
    camera_ops: ["Push Camera States", "Pull Camera Snapshot"]
    sequence_ops: ["Send Sequence Frames"]
  state_management: "zustand"
  subscription_model: "selector-based (useEditorSelector)"
  image_architecture: "reference cache (image-cache.ts)"
  render_backend:
    canvas2d: true
    webgl_preview: true
    webgl_module: "src/app/components/webgl-adjustments.ts"
    webgl_fallback: "automatic to CPU adjustments"
  worker_processing:
    enabled: true
    worker_entry: "src/app/components/image-processing.worker.ts"
    offscreen_canvas: true
    fallback: "automatic to main-thread"
  infinite_canvas_lines: 1356
  phase_8_baseline_lines:
